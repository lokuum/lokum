name: Scrape Real Estate Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      voivodeship:
        description: 'Województwo do zeskrapowania (puste = wszystkie po kolei)'
        required: false
        default: ''
      limit:
        description: 'Maksymalna liczba stron per kategoria'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Krok 1: Województwo Lubelskie (UA / BY)
      - name: Scrape Lubelskie
        if: ${{ github.event.inputs.voivodeship == '' || github.event.inputs.voivodeship == 'lubelskie' }}
        continue-on-error: true
        run: |
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          echo "=== Rozpoczynam scrapowanie woj. Lubelskiego (limit: $LIMIT stron) ==="
          npm run scrape:lubelskie -- --limit "$LIMIT"

      # Krok 2: Województwo Podlaskie (BY / LT)
      - name: Scrape Podlaskie
        if: ${{ github.event.inputs.voivodeship == '' || github.event.inputs.voivodeship == 'podlaskie' }}
        continue-on-error: true
        run: |
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          echo "=== Rozpoczynam scrapowanie woj. Podlaskiego (limit: $LIMIT stron) ==="
          npm run scrape:podlaskie -- --limit "$LIMIT"

      # Krok 3: Województwo Podkarpackie (UA / SK)
      - name: Scrape Podkarpackie
        if: ${{ github.event.inputs.voivodeship == '' || github.event.inputs.voivodeship == 'podkarpackie' }}
        continue-on-error: true
        run: |
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          echo "=== Rozpoczynam scrapowanie woj. Podkarpackiego (limit: $LIMIT stron) ==="
          npm run scrape:podkarpackie -- --limit "$LIMIT"

      # Krok 4: Generowanie globalnego podsumowania (summary.json) ze wszystkich partycji
      - name: Generate Summary and Global Stats
        run: |
          echo "=== Generowanie globalnego summary.json z aktualnych partycji ==="
          npm run scrape:summary

      # Krok 5: Commit i push zmian do repozytorium
      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ frontend/public/data/
          if git diff --staged --quiet; then
            echo "Brak nowych zmian w cenach ani ofertach do skomitowania"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update property data $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
