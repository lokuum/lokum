name: Scrape Real Estate Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      voivodeship:
        description: 'Województwo do zeskrapowania (puste = wszystkie)'
        required: false
        default: ''
      limit:
        description: 'Maksymalna liczba stron per kategoria'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.voivodeship }}" ]; then
            ARGS="$ARGS --voivodeship ${{ github.event.inputs.voivodeship }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          npm run scrape --workspace scraper -- $ARGS

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ frontend/public/data/
          if git diff --staged --quiet; then
            echo "No changes in property prices or offers"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update property data $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
